name: "[Linter] PPL multi-surface compatibility"

# Validate the 12 active PPL lint rules on the checked-in OSD fallback grammar
# and on runtime grammar bundles exported by the latest eligible GA engine and
# this SQL pull request. Compatibility differences are data until the aggregate
# job has published the complete 12 x 3 matrix.

on:
  pull_request:
    paths:
      - 'build.gradle'
      - 'integ-test/build.gradle'
      - 'integ-test/src/test/java/org/opensearch/sql/calcite/remote/PplLintRuleValidationIT.java'
      - 'integ-test/src/test/resources/ppl-lint/**'
      - 'scripts/ppl-lint/**'
      - '.github/workflows/ppl-lint-multiversion-validation.yml'
  workflow_dispatch:
    inputs:
      osd_repo:
        description: OSD repository containing the detector implementation.
        required: false
        type: string
      osd_ref:
        description: OSD branch or commit containing the detector implementation.
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: ppl-lint-multi-surface-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  Get-CI-Image-Tag:
    uses: opensearch-project/opensearch-build/.github/workflows/get-ci-image-tag.yml@761e093b8c1349cc07f21c1d681d3b30bf9e1999 # main
    with:
      product: opensearch

  plan:
    name: Plan compatibility matrix
    runs-on: ubuntu-latest
    outputs:
      released_targets: ${{ steps.outputs.outputs.released_targets }}
      osd_repo: ${{ steps.outputs.outputs.osd_repo }}
      osd_ref: ${{ steps.outputs.outputs.osd_ref }}
      pr_target: ${{ steps.outputs.outputs.pr_target }}
    steps:
      - name: Checkout SQL pull request
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Read official OpenSearch GA tags
        run: |
          set -euo pipefail
          git ls-remote --tags --refs https://github.com/opensearch-project/OpenSearch.git \
            > "$RUNNER_TEMP/opensearch-release-tags.txt"

      - name: Resolve target versions and configurations
        env:
          REQUESTED_OSD_REPO: ${{ inputs.osd_repo }}
          REQUESTED_OSD_REF: ${{ inputs.osd_ref }}
          VARIABLE_OSD_REPO: ${{ vars.OSD_REPO }}
          VARIABLE_OSD_REF: ${{ vars.OSD_REF }}
        run: |
          set -euo pipefail
          osd_repo="${REQUESTED_OSD_REPO:-${VARIABLE_OSD_REPO:-opensearch-project/OpenSearch-Dashboards}}"
          osd_ref="${REQUESTED_OSD_REF:-${VARIABLE_OSD_REF:-main}}"
          node scripts/ppl-lint/plan-compatibility.mjs \
            --build-file build.gradle \
            --release-tags "$RUNNER_TEMP/opensearch-release-tags.txt" \
            --compiled-version 2.19.6 \
            --sql-sha "$GITHUB_SHA" \
            --osd-repository "$osd_repo" \
            --osd-ref "$osd_ref" \
            --out compatibility-plan.json

      - name: Publish plan outputs
        id: outputs
        run: |
          set -euo pipefail
          {
            echo "released_targets=$(jq -c '.releasedTargets' compatibility-plan.json)"
            echo "osd_repo=$(jq -r '.osd.repository' compatibility-plan.json)"
            echo "osd_ref=$(jq -r '.osd.ref' compatibility-plan.json)"
            echo "pr_target=$(jq -r '.prTargetVersion' compatibility-plan.json)"
          } >> "$GITHUB_OUTPUT"
          {
            echo '## PPL lint compatibility plan'
            echo
            echo "- PR target: \`$(jq -r '.prTargetVersion' compatibility-plan.json)\`"
            echo "- Latest eligible GA: \`$(jq -r '.latestEligibleGa' compatibility-plan.json)\`"
            echo "- OSD: \`$(jq -r '.osd.repository + " @ " + .osd.ref' compatibility-plan.json)\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload compatibility plan
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ppl-lint-compatibility-plan
          path: compatibility-plan.json
          if-no-files-found: error

  observe-released:
    name: Observe engine ${{ matrix.version }} (${{ matrix.label }})
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.released_targets) }}
    services:
      opensearch:
        image: opensearchproject/opensearch:${{ matrix.version }}
        env:
          discovery.type: single-node
          DISABLE_SECURITY_PLUGIN: 'true'
          DISABLE_INSTALL_DEMO_CONFIG: 'true'
          OPENSEARCH_JAVA_OPTS: -Xms1g -Xmx1g
        ports:
          - 9200:9200
        options: >-
          --health-cmd "curl -sf http://localhost:9200/_cluster/health || exit 1"
          --health-interval 15s
          --health-timeout 10s
          --health-retries 20
          --health-start-period 60s
    steps:
      - name: Checkout SQL pull request
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Confirm released engine identity
        run: |
          set -euo pipefail
          for attempt in $(seq 1 40); do
            curl -sf http://localhost:9200 > "$RUNNER_TEMP/engine-root.json" && break
            echo "waiting for engine (${attempt}/40)..."
            sleep 5
          done
          reported=$(jq -r '.version.number' "$RUNNER_TEMP/engine-root.json")
          case "$reported" in
            ${{ matrix.version }}*) ;;
            *) echo "::error::engine reported $reported; expected ${{ matrix.version }}"; exit 1 ;;
          esac
          curl -sf http://localhost:9200/_cat/plugins | grep -i sql

      - name: Set up JDK 21
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: temurin
          java-version: 21

      - name: Observe backend contracts
        env:
          EXPORT_RUNTIME_BUNDLE: ${{ matrix.export_runtime_bundle }}
        run: |
          set -euo pipefail
          mkdir -p leg
          bundle_args=()
          if [ "$EXPORT_RUNTIME_BUNDLE" = 'true' ]; then
            bundle_args+=("-Dppl.lint.grammar.bundle=$(pwd)/leg/ppl-grammar-bundle.json")
          fi
          {
            printf './gradlew :integ-test:integTestRemote '
            printf '%q ' \
              '--tests' 'org.opensearch.sql.calcite.remote.PplLintRuleValidationIT' \
              '-Dtests.rest.cluster=localhost:9200' \
              '-Dtests.cluster=localhost:9200' \
              '-Dtests.clustername=docker-cluster' \
              '-Dppl.lint.schedule=nightly' \
              '-Dppl.lint.observe.only=true' \
              '-Dppl.lint.execution_backend=standard' \
              "-Dppl.lint.sql_sha=$GITHUB_SHA" \
              "-Dppl.lint.report=$(pwd)/leg/backend-report.json" \
              "-Dppl.lint.target=$(pwd)/leg/target.json" \
              "${bundle_args[@]}"
            echo
          } > leg/backend-command.txt
          ./gradlew :integ-test:integTestRemote \
            --tests org.opensearch.sql.calcite.remote.PplLintRuleValidationIT \
            -Dtests.rest.cluster=localhost:9200 \
            -Dtests.cluster=localhost:9200 \
            -Dtests.clustername=docker-cluster \
            -Dppl.lint.schedule=nightly \
            -Dppl.lint.observe.only=true \
            -Dppl.lint.execution_backend=standard \
            -Dppl.lint.sql_sha="$GITHUB_SHA" \
            -Dppl.lint.report="$(pwd)/leg/backend-report.json" \
            -Dppl.lint.target="$(pwd)/leg/target.json" \
            "${bundle_args[@]}"

      - name: Upload released observation
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.artifact_name }}
          path: leg
          if-no-files-found: warn

      - name: Upload released observation logs
        if: ${{ failure() }}
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.artifact_name }}-logs
          path: |
            integ-test/build/reports/**
            integ-test/build/test-results/**
          if-no-files-found: warn

  observe-pr-build:
    name: Observe engine pr-build (runtime)
    needs:
      - Get-CI-Image-Tag
      - plan
    runs-on: ubuntu-latest
    timeout-minutes: 35
    container:
      image: ${{ needs.Get-CI-Image-Tag.outputs.ci-image-version-linux }}
      options: ${{ needs.Get-CI-Image-Tag.outputs.ci-image-start-options }}
    steps:
      - name: Run start commands
        run: ${{ needs.Get-CI-Image-Tag.outputs.ci-image-start-command }}

      - name: Checkout SQL pull request
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up JDK 21
        uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: temurin
          java-version: 21

      - name: Observe backend contracts
        run: |
          set -euo pipefail
          mkdir -p leg
          chown -R 1000:1000 "$(pwd)"
          command="./gradlew :integ-test:integTest --tests org.opensearch.sql.calcite.remote.PplLintRuleValidationIT -Dppl.lint.schedule=nightly -Dppl.lint.observe.only=true -Dppl.lint.execution_backend=standard -Dppl.lint.sql_sha=$GITHUB_SHA -Dppl.lint.report=$(pwd)/leg/backend-report.json -Dppl.lint.grammar.bundle=$(pwd)/leg/ppl-grammar-bundle.json -Dppl.lint.target=$(pwd)/leg/target.json"
          printf '%s\n' "$command" > leg/backend-command.txt
          su "$(id -un 1000)" -c "$command"

      - name: Upload PR-build observation
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ppl-lint-observation-pr-build-runtime
          path: leg
          if-no-files-found: warn

      - name: Upload PR-build observation logs
        if: ${{ failure() }}
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ppl-lint-observation-pr-build-runtime-logs
          path: |
            integ-test/build/reports/**
            integ-test/build/test-results/**
            integ-test/build/testclusters/*/logs/*
          if-no-files-found: warn

  aggregate:
    name: Aggregate rule compatibility
    if: ${{ always() && needs.plan.result == 'success' }}
    needs:
      - plan
      - observe-released
      - observe-pr-build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout SQL pull request
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Download compatibility plan
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4
        with:
          name: ppl-lint-compatibility-plan
          path: plan

      - name: Download available observations
        continue-on-error: true
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4
        with:
          pattern: ppl-lint-observation-*
          path: legs

      - name: Checkout OpenSearch-Dashboards
        id: osd-checkout
        continue-on-error: true
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          repository: ${{ needs.plan.outputs.osd_repo }}
          ref: ${{ needs.plan.outputs.osd_ref }}
          path: .ci/OpenSearch-Dashboards

      - name: Record OSD revision
        id: osd-revision
        if: ${{ always() }}
        run: |
          if sha=$(git -C .ci/OpenSearch-Dashboards rev-parse HEAD 2>/dev/null); then
            echo "available=true" >> "$GITHUB_OUTPUT"
            echo "sha=$sha" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "sha=" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Node from OSD .nvmrc
        if: ${{ steps.osd-revision.outputs.available == 'true' }}
        continue-on-error: true
        uses: actions/setup-node@1e60f620b9541d16bece96c5465dc8ee9832be0b # v4
        with:
          node-version-file: .ci/OpenSearch-Dashboards/.nvmrc

      - name: Pin Yarn from OSD engines
        if: ${{ steps.osd-revision.outputs.available == 'true' }}
        continue-on-error: true
        working-directory: .ci/OpenSearch-Dashboards
        run: |
          yarn_range=$(node -e "process.stdout.write(require('./package.json').engines.yarn)")
          yarn_version=$(echo "$yarn_range" | sed -E 's/[^0-9.]//g')
          npm install -g "yarn@${yarn_version}"

      - name: Cache OSD Yarn dependencies
        if: ${{ steps.osd-revision.outputs.available == 'true' }}
        continue-on-error: true
        uses: actions/cache@0c907a75c2c80ebcb7f088228285e798b750cf8f # v4
        with:
          path: ~/.cache/yarn
          key: ${{ runner.os }}-osd-yarn-${{ hashFiles('.ci/OpenSearch-Dashboards/yarn.lock') }}
          restore-keys: ${{ runner.os }}-osd-yarn-

      - name: Bootstrap OpenSearch-Dashboards once
        id: osd-bootstrap
        if: ${{ steps.osd-revision.outputs.available == 'true' }}
        continue-on-error: true
        working-directory: .ci/OpenSearch-Dashboards
        run: |
          for attempt in 1 2 3; do
            yarn osd bootstrap && exit 0
            echo "Bootstrap attempt $attempt failed; retrying in 10 seconds."
            sleep 10
          done
          exit 1

      - name: Run applicable detector passes
        if: ${{ steps.osd-bootstrap.outcome == 'success' }}
        continue-on-error: true
        run: |
          set -uo pipefail
          while IFS= read -r configuration; do
            id=$(jq -r '.id' <<< "$configuration")
            artifact=$(jq -r '.artifactName' <<< "$configuration")
            surface=$(jq -r '.surface' <<< "$configuration")
            engine_mode=$(jq -r '.engineMode' <<< "$configuration")
            leg="$GITHUB_WORKSPACE/legs/$artifact"
            mkdir -p "$leg"
            if [ ! -s "$leg/target.json" ] || [ ! -s "$leg/backend-report.json" ]; then
              echo "Skipping detector pass for $id: backend evidence is incomplete."
              continue
            fi

            if [ "$surface" = 'compiled-simplified' ]; then
              grammar_root=".ci/OpenSearch-Dashboards/packages/osd-antlr-grammar/src/opensearch_ppl_simplified"
              grammar_hash=$(
                find "$grammar_root" -type f -print0 |
                  sort -z |
                  xargs -0 sha256sum |
                  sha256sum |
                  awk '{print "sha256:" $1}'
              )
              jq --arg hash "$grammar_hash" \
                '.grammarHash = $hash | .grammarBundle = ""' \
                "$leg/target.json" > "$leg/detector-target.json"
              bundle=''
            else
              cp "$leg/target.json" "$leg/detector-target.json"
              bundle="$leg/ppl-grammar-bundle.json"
              if [ ! -s "$bundle" ]; then
                echo "Skipping detector pass for $id: runtime grammar bundle is missing."
                continue
              fi
            fi

            {
              printf 'cd %q && env ' "$GITHUB_WORKSPACE/.ci/OpenSearch-Dashboards"
              printf 'PPL_LINT_SURFACE=%q ' "$surface"
              printf 'PPL_LINT_ENGINE_MODE=%q ' "$engine_mode"
              printf 'PPL_LINT_APPLICABLE_ONLY=1 '
              printf 'PPL_LINT_GRAMMAR_BUNDLE=%q ' "$bundle"
              printf 'PPL_LINT_TARGET_MANIFEST=%q ' "$leg/detector-target.json"
              printf 'PPL_LINT_BACKEND_REPORT=%q ' "$leg/backend-report.json"
              printf 'PPL_LINT_CONTRACT_DIR=%q ' "$GITHUB_WORKSPACE/integ-test/src/test/resources/ppl-lint/contracts"
              printf 'PPL_LINT_SCHEDULE=nightly PPL_LINT_OBSERVE_ONLY=1 '
              printf 'PPL_LINT_REPORT=%q ' "$leg/detector-report.json"
              printf 'node -r ./src/setup_node_env %q\n' \
                "$GITHUB_WORKSPACE/scripts/ppl-lint/run-frontend-contract.mjs"
            } > "$leg/detector-command.txt"

            (
              cd .ci/OpenSearch-Dashboards
              env \
                PPL_LINT_SURFACE="$surface" \
                PPL_LINT_ENGINE_MODE="$engine_mode" \
                PPL_LINT_APPLICABLE_ONLY=1 \
                PPL_LINT_GRAMMAR_BUNDLE="$bundle" \
                PPL_LINT_TARGET_MANIFEST="$leg/detector-target.json" \
                PPL_LINT_BACKEND_REPORT="$leg/backend-report.json" \
                PPL_LINT_CONTRACT_DIR="$GITHUB_WORKSPACE/integ-test/src/test/resources/ppl-lint/contracts" \
                PPL_LINT_SCHEDULE=nightly \
                PPL_LINT_OBSERVE_ONLY=1 \
                PPL_LINT_REPORT="$leg/detector-report.json" \
                node -r ./src/setup_node_env \
                  "$GITHUB_WORKSPACE/scripts/ppl-lint/run-frontend-contract.mjs"
            ) > "$leg/detector.log" 2>&1 || true
            tail -10 "$leg/detector.log" || true
          done < <(jq -c '.configurations[]' plan/compatibility-plan.json)

      - name: Aggregate every planned rule and configuration
        id: compatibility
        if: ${{ always() }}
        run: |
          set +e
          node scripts/ppl-lint/aggregate-compatibility.mjs \
            --plan plan/compatibility-plan.json \
            --contracts integ-test/src/test/resources/ppl-lint/contracts \
            --artifacts legs \
            --osd-sha "${{ steps.osd-revision.outputs.sha }}" \
            --out drift-report.json \
            --summary "$GITHUB_STEP_SUMMARY"
          result=$?
          echo "exit_code=$result" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload drift report
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ppl-lint-multiversion-drift
          path: drift-report.json
          if-no-files-found: error

      - name: Upload compatibility evidence
        if: ${{ always() }}
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ppl-lint-multiversion-evidence
          path: |
            plan/compatibility-plan.json
            legs/**/backend-report.json
            legs/**/detector-report.json
            legs/**/target.json
            legs/**/detector-target.json
            legs/**/*-command.txt
            legs/**/detector.log
          if-no-files-found: warn

      - name: Fail after publishing compatibility results
        if: ${{ always() }}
        env:
          AGGREGATE_EXIT: ${{ steps.compatibility.outputs.exit_code }}
        run: |
          set -euo pipefail
          if [ ! -s drift-report.json ]; then
            echo "::error::drift-report.json was not published"
            exit 1
          fi
          jq -e '
            .schemaVersion == 3 and
            .inventory.ruleCount == 12 and
            (.inventory.ruleIds | length) == 12 and
            (.configurations | length) == 3 and
            (.matrix | length) == 36 and
            .result.cellCount == 36 and
            (
              .result.compatible + .result.notApplicable +
              .result.drift + .result.inconclusive
            ) == 36
          ' drift-report.json > /dev/null
          if [ -z "$AGGREGATE_EXIT" ]; then
            echo "::error::compatibility aggregation did not complete"
            exit 1
          fi
          if [ "$AGGREGATE_EXIT" -ne 0 ]; then
            drift=$(jq -r '.result.drift' drift-report.json)
            inconclusive=$(jq -r '.result.inconclusive' drift-report.json)
            echo "::error::rule compatibility validation failed after artifact publication: $drift drift, $inconclusive inconclusive"
            exit "$AGGREGATE_EXIT"
          fi
